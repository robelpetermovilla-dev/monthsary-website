```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Little Memories 📸</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, #ffd6e5, transparent 35%),
        radial-gradient(circle at bottom right, #ffc1d8, transparent 35%),
        #fff0f5;

      color: #5a3040;
      padding: 50px 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .title {
      text-align: center;
      color: #d94f7c;
      font-size: clamp(2.2rem, 6vw, 4rem);
      margin-bottom: 15px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 45px;
      font-size: 1.1rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 25px;
    }

    .photo {
      height: 320px;
      border-radius: 22px;
      overflow: hidden;
      background: #ffdce8;

      box-shadow: 0 12px 30px rgba(100, 40, 60, 0.15);

      transition: 0.4s;
      animation: appear 0.8s ease;
    }

    .photo:hover {
      transform: translateY(-8px) rotate(1deg) scale(1.02);
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .back {
      display: block;
      width: fit-content;

      margin: 45px auto 0;

      padding: 13px 27px;

      border-radius: 50px;
      background: #d94f7c;
      color: white;

      text-decoration: none;
      font-weight: bold;

      transition: 0.3s;
    }

    .back:hover {
      transform: translateY(-3px);
      background: #c83f6c;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 30px 15px;
      }

      .photo {
        height: 280px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1 class="title">
     Little Memories 📸
    </h1>

    <p class="subtitle">
      Some of my favorite moments with you. 💗
    </p>

    <div class="gallery">

      <div class="photo">
        <img src="Babab1.jpeg" alt="Our memory 1">
      </div>

      <div class="photo">
        <img src="Babab2.jpeg" alt="Our memory 2">
      </div>

      <div class="photo">
        <img src="Babab3.jpeg" alt="Our memory 3"> 
      </div>

      <div class="photo">
        <img src="Babab4.jpeg" alt="Our memory 4">
      </div>

    </div>

    <a href="index.html" class="back">
      ← Back to the main page
    </a>

  </div>

</body>
</html>
```
